name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (GitHub Pages base)
        env:
          VITE_SITE_URL: https://konbu-create.github.io/konbu-create/
          VITE_BASE: /konbu-create/
          GITHUB_ACTIONS: true
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"

      - name: Summary
        run: |
          echo "Deployed to https://konbu-create.github.io/konbu-create/" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ | head -n 40 >> $GITHUB_STEP_SUMMARY || true
